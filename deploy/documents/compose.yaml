name: shallow-ask-documents

services:
  xiaomi-ocr:
    image: vllm/vllm-openai:v0.33.0
    gpus: all
    shm_size: 1gb
    command:
      - --model
      - xiaomi-research/Xiaomi-OCR-0
      - --revision
      - e4d1c4a6804bd9ef342b93d705a73af003e2ef4e
      - --served-model-name
      - xiaomi-ocr-0
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      - --gpu-memory-utilization
      - "0.78"
      - --compilation-config
      - '{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [4]}'
      - --speculative-config
      - '{"method": "ngram_gpu", "num_speculative_tokens": 3, "prompt_lookup_min": 2, "prompt_lookup_max": 5}'
    volumes:
      - weights:/root/.cache/huggingface
      - cuda-cache:/root/.nv
      - triton-cache:/root/.triton
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 10m
      retries: 6

  any2markdown:
    image: shallow-ask/any2markdown:54bf7f0
    build:
      context: https://github.com/SeerRay-Lab/Any2Markdown.git#54bf7f0a27d87ef43b712b948c97ec23bfa81c59
    environment:
      ANY2MD_BASE_URL: http://xiaomi-ocr:8000/v1
      ANY2MD_MODEL: xiaomi-ocr-0
      ANY2MD_TABLE_FORMAT: html
      ANY2MD_PROMPT: >-
        Extract all visible text from this document image in reading order, including
        headers and footers. Represent it in Markdown, tables in OTSL (preserve empty
        cells) and formulas in LaTeX. Transcribe only what is present in the image.
      ANY2MD_CONCURRENCY: "1"
      ANY2MD_PDF_WORKERS: "1"
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - xiaomi-ocr

volumes:
  weights:
  cuda-cache:
  triton-cache:
