# 当前清单格式使用独立集合（显式主键 + 动态分块元数据）。
collection_name: knowledge_chunks_v1
embedding_model: qwen3.7-text-embedding-flash
# 索引管线修订号：解析规则或服务端模型行为变化时递增，触发完整重建。
# 分块参数、嵌入模型与解析依赖版本也会自动计入索引版本指纹。
index_version: 1

# Milvus 配置（通过 Docker 部署 Milvus 服务）
milvus_uri: "http://localhost:19530"

# Milvus gRPC 连接池大小（每个 API 进程各自持有），默认值 1 在高并发下会成为瓶颈。
# 检索并发上不去时可继续调大；多 worker 部署时总量为 workers × 本值。
pool_size: 50

chunk_size: 500
chunk_overlap: 50
separators: ["\n\n", "\n", "? ", "! ", "。", "？", "！", "; ", "；", ": ", "：", " ", ""]

# 单次 embedding 请求最多提交的块数。DashScope 库内的 BATCH_SIZE 表在升级/重装依赖后会还原，
# 这里配置的取值会在进程启动时覆盖到当前 embedding_model 对应的表项。
embedding_batch_size: 20

k: 3

knowledge_dir: knowledge
allowed_types: [".txt",".pdf",".docx"]

# 索引健康自检间隔（小时）：检查 PostgreSQL 清单 / knowledge / Milvus 每一块内容
health_check_interval_hours: 6
# 索引自愈：自检发现问题时自动执行修复并复查，直至通过
# 单轮自愈最多执行修复的次数（防止异常情况下自愈循环不终止）
health_auto_repair_max_rounds: 3
