# 每个账号下的项目使用独立集合：前缀 + 账号 ID + 项目 UUID。
collection_prefix: private_knowledge
embedding_model: qwen3.7-text-embedding-flash
embedding_endpoint: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
# 索引管线修订号：解析规则或服务端模型行为变化时递增，触发完整重建。
# 分块参数、嵌入模型与解析依赖版本也会自动计入索引版本指纹。
index_version: 2

# Milvus 配置（通过 Docker 部署 Milvus 服务）
milvus_uri: "http://localhost:19530"

# Milvus gRPC 连接池大小（每个 API 进程各自持有），默认值 1 在高并发下会成为瓶颈。
# 检索并发上不去时可继续调大；多 worker 部署时总量为 workers × 本值。
pool_size: 50

chunk_size: 500
chunk_overlap: 50
separators: ["\n\n", "\n", "? ", "! ", "。", "？", "！", "; ", "；", ": ", "：", " ", ""]

# 单次 embedding 请求最多提交的块数，每批独立重试。
embedding_batch_size: 20
embedding_connect_timeout_seconds: 5
embedding_timeout_seconds: 20
# 包括首次请求，避免上游网络故障时使用 SDK 的长时间等待。
embedding_max_attempts: 3

# BM25 在 Milvus 内生成稀疏向量，与稠密向量共用分块主键和索引事务。
# 分词配置属于集合结构，修改后需要重新创建集合。
bm25_analyzer:
  tokenizer: jieba
  filter: [lowercase, cnalphanumonly]

# 源文件位于项目外，默认仓库同级 shallow-ask-deep-answer-data/账号 ID/项目 UUID。
# 使用环境变量 KNOWLEDGE_STORAGE_ROOT 指定其他绝对路径。
allowed_types: [".txt",".pdf",".docx"]

# 索引健康自检间隔（小时）：逐项目检查 PostgreSQL 清单 / 源文件 / Milvus 每一块内容
health_check_interval_hours: 6
# 索引自愈：自检发现问题时自动执行修复并复查，直至通过
# 单轮自愈最多执行修复的次数（防止异常情况下自愈循环不终止）
health_auto_repair_max_rounds: 3
